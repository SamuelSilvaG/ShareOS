# ShareOS: announce the box as <hostname>.local (mDNS) in the local network,
# so https://shareos.local works without router settings. The SMB server is
# announced by shareos-shares while SMB is active.
[server]
use-ipv4=yes
use-ipv6=no
allow-interfaces=eth0
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[wide-area]
enable-wide-area=no

[publish]
publish-hinfo=no
publish-workstation=no

[reflector]

[rlimits]
