name: website

# Builds the project website (website/ + docs as wiki) and publishes it on
# GitHub Pages: https://uniquedroid.github.io/ShareOS/
# Once: Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.github/workflows/pages.yml'
  # After a release build: the github-pages environment only accepts runs on
  # main, and a "release" event runs on the tag – workflow_run runs on main.
  workflow_run:
    workflows: [build]
    types: [completed]
  schedule:
    - cron: '23 4 * * *'   # daily: fresh app catalog, discussions and stars in data.json
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # only release builds (tags v*) and the other triggers, not every build of main
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Assemble the site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 website/build.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
