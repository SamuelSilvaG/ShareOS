name: build

on:
  push:
    branches: [main, 'phase*']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        board: [dns320l]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # version.sh uses git describe

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex cpio rsync unzip file wget \
            libssl-dev libncurses-dev python3

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: dl-${{ hashFiles('configs/*_defconfig', 'Makefile', 'patches/**/*.hash') }}
          restore-keys: dl-

      - name: Build ${{ matrix.board }}
        run: make ${{ matrix.board }}

      - name: Collect images
        run: |
          mkdir -p artifacts
          cp output/${{ matrix.board }}/images/ShareOS-*.bin* artifacts/
          cp output/${{ matrix.board }}/images/modules.tar.xz artifacts/modules-${{ matrix.board }}.tar.xz
          ls -l artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: shareos-${{ matrix.board }}
          path: artifacts/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          prerelease: ${{ contains(github.ref_name, '-') }}
